services:
  postgres:
    image: postgres:16-alpine
    container_name: lab04-postgres
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "5444:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab"]
      interval: 2s
      timeout: 2s
      retries: 15
